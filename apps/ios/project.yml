name: Wain
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: FBH9JL8MB9
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 0.2.0
    CURRENT_PROJECT_VERSION: 1
packages:
  ThinkingOrbs:
    url: https://github.com/yogesharc/thinking-orbs
    revision: 78760661f652ffb1fa1955cd7ea41657fb7beae7
targets:
  Wain:
    type: application
    platform: iOS
    sources:
      - Wain
      # The Island's dictation orb, shared by path as the Island shares this app's client.
      - path: ../island/Island/VoiceOrb.swift
      - path: ../island/Island/VoiceOrb.metal
      # Bot faces: the app's Blobatar bundled for JavaScriptCore, the Island's own copy.
      - path: ../island/Island/botface.js
        buildPhase: resources
      # The extension's dressing, for the simulator test that simctl push gives no extension.
      - path: WainNotify/Dress.swift
    dependencies:
      - package: ThinkingOrbs
      - target: WainNotify
    entitlements:
      # Push, and a bot's alert drawn as a message from it (#1299).
      path: Wain/Wain.entitlements
      properties:
        aps-environment: development
        com.apple.developer.usernotifications.communication: true
    scheme:
      testTargets: [WainTests, WainUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wainhq.wain.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        # The `wain://` scheme a pairing QR opens, and the launch screen's page colour and
        # white mark, which no INFOPLIST_KEY can say.
        INFOPLIST_FILE: Wain/Info.plist
        INFOPLIST_KEY_NSCameraUsageDescription: Wain scans the QR code a Mac or server shows, to add it.
        INFOPLIST_KEY_CFBundleDisplayName: Wain
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Wain records your dictation and turns it into text, on this device or on your Mac.
        # Share's Save Image, which crashes the app without it.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Wain saves the image you shared to your photos.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # Only HTTPS and standard crypto, so TestFlight asks nothing about export.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  # Dresses an alert before it shows: a bot's face as the sender, a question's options as buttons.
  WainNotify:
    type: app-extension
    platform: iOS
    sources:
      - WainNotify
      - path: Wain/BotFace.swift
      - path: Wain/BotAvatar.swift
      - path: ../island/Island/botface.js
        buildPhase: resources
    info:
      path: WainNotify/Info.plist
      properties:
        CFBundleDisplayName: Wain
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wainhq.wain.ios.notify
        TARGETED_DEVICE_FAMILY: "1,2"
  WainTests:
    type: bundle.unit-test
    platform: iOS
    sources: [WainTests]
    dependencies:
      - target: Wain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wainhq.wain.ios.tests
        GENERATE_INFOPLIST_FILE: YES
  WainUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [WainUITests]
    dependencies:
      - target: Wain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wainhq.wain.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
