# The docs as Blume builds them: one folder per page, plus .md/.mdx twins for agents.
server {
    listen 80;
    root /usr/share/nginx/html;
    charset utf-8;
    charset_types text/markdown text/plain application/json;

    gzip on;
    gzip_types text/markdown text/plain text/css application/javascript application/json image/svg+xml;

    # Blume writes every link with /docs in front. www.wainhq.com's rewrite strips it
    # on the way here; a visit straight to docs.wainhq.com keeps it, so strip it too.
    location = /docs { rewrite ^ / last; }
    location ^~ /docs/ { rewrite ^/docs/(.*)$ /$1 last; }

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # nginx's own table has no Markdown; an empty types block lets default_type decide.
    location ~ \.mdx?$ {
        types {}
        default_type text/markdown;
    }

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
}
