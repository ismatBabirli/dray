name: Desktop build setup
description: >
  pnpm, Rust with both Apple targets, the cargo cache and the CEF build tools,
  for one of release.yml's Mac build legs. A beta's leg, on `main`, saves the
  cache under the key this restores, so the next beta and the next release
  find it.

inputs:
  target:
    description: The leg's target triple. Each leg caches only what it builds.
    required: true

outputs:
  cache-key:
    description: The exact key this run looked for, for the leg to save under.
    value: ${{ steps.cache.outputs.cache-primary-key }}
  cache-hit:
    description: Whether that exact key already exists.
    value: ${{ steps.cache.outputs.cache-hit }}
  cache-path:
    description: Every path the key covers.
    value: ${{ steps.paths.outputs.paths }}

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      # Per runner, not the default ~/setup-pnpm: the release Mac's two runners
      # share a home, and one job reinstalling it pulled pnpm from the other.
      with:
        dest: ${{ runner.tool_cache }}/setup-pnpm
    # No pnpm store cache: restoring it was 25s ahead of everything else,
    # where the install fetching its packages afresh runs hidden behind the
    # cargo cache below.
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22

    # Started here and waited for at the end, so it runs while the cargo cache
    # below downloads: 26s on its own, measured on v0.30.6. The desktop app's
    # dependencies alone, since nothing here builds the site or the docs —
    # 588 packages of the workspace's 1112.
    - shell: bash
      run: |
        nohup sh -c 'pnpm install --frozen-lockfile --filter wain > "$RUNNER_TEMP/pnpm-install.log" 2>&1; echo $? > "$RUNNER_TEMP/pnpm-install.status"' >/dev/null 2>&1 &

    - id: rust
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        targets: aarch64-apple-darwin,x86_64-apple-darwin

    # Plain `actions/cache` rather than `swatinem/rust-cache`, for one path in
    # this list: `registry/src`. rust-cache deletes it before saving, since
    # cargo can re-extract it from the `.crate` archives beside it — true, and
    # it halves the cache. But re-extraction stamps every source file with the
    # restore time, *newer* than the `target` artifacts restored alongside, and
    # build scripts are mtime-checked: every crate carrying one reruns and
    # everything downstream rebuilds. Measured with rust-cache reporting `full
    # match: true`: 40 crates per target for ~8 minutes a target. Tar restores
    # mtimes as saved, so keeping `src` keeps the order. The cost is a larger
    # entry and a target dir nothing prunes but GitHub's 10 GB LRU eviction.
    #
    # The key holds what the build scripts are rerun on: `cc` prints
    # `rerun-if-env-changed=DEVELOPER_DIR`, so a cache built under another
    # Xcode reran every C build script and rebuilt 67 crates downstream, ten
    # minutes a leg, under an exact hit. And it leaves out `wain`'s own
    # version, which a beta and every release bump change and which rebuilds
    # `wain` alone, so a version change still hits.
    - id: paths
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        RUST: ${{ steps.rust.outputs.cachekey }}
      run: |
        strip_root() { awk 'skip { skip = 0; next } /^name = "wain"$/ { skip = 1 } { print }' "$1"; }
        lock=$(strip_root apps/desktop/src-tauri/Cargo.lock | shasum -a 256 | cut -c1-16)
        xcode=$(xcodebuild -version | tr -cd 'A-Za-z0-9.')
        prefix="darwin-cargo-$RUNNER_ARCH-$RUST-$xcode-$TARGET-"
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "key=$prefix$lock" >> "$GITHUB_OUTPUT"
        {
          echo 'paths<<EOF'
          printf '%s\n' '~/.cargo/registry/index' '~/.cargo/registry/cache' \
            '~/.cargo/registry/src' '~/.cargo/git/db' '~/.cache/cef' \
            'apps/desktop/src-tauri/target'
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"

    # Restore only. The leg saves, on `main` alone: the one scope a tag build
    # can read from, where a tag saving would write under its own ref that
    # nothing reads again. A dependency change misses the exact key once, and
    # the prefix restore carries the tree across until that beta saves.
    # Skipped on the release Mac. Its runners set CARGO_BUILD_BUILD_DIR to a
    # folder outside the checkout, so checkout's `git clean` never reaches the
    # intermediates and they persist between runs; a restore would only lay
    # older artifacts over them.
    - id: cache
      if: runner.environment == 'github-hosted'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.paths.outputs.paths }}
        # Wain: per host arch. Build scripts and proc-macros only run where they were built,
        # so an arm64 cache restored on an Intel Mac still recompiled all 445 crates.
        key: ${{ steps.paths.outputs.key }}
        restore-keys: ${{ steps.paths.outputs.prefix }}

    # Capped, so an install that hangs fails the job rather than holding it.
    - shell: bash
      run: |
        for _ in $(seq 300); do [ -s "$RUNNER_TEMP/pnpm-install.status" ] && break; sleep 1; done
        cat "$RUNNER_TEMP/pnpm-install.log"
        exit "$(cat "$RUNNER_TEMP/pnpm-install.status" 2>/dev/null || echo 1)"

    # The browser's bindings compile against the CEF SDK: headers plus a C++
    # wrapper that `cef-dll-sys`'s build script builds with CMake and Ninja,
    # downloading the SDK into CEF_PATH first (one per target), where the cache
    # above keeps it. The framework inside is never copied anywhere — the app
    # fetches its own after install, see chromium.rs. The runner image carries
    # ninja already; `brew install` spent 7s saying so.
    - shell: bash
      run: |
        command -v ninja >/dev/null || brew install ninja
        echo "CEF_PATH=$HOME/.cache/cef" >> "$GITHUB_ENV"
